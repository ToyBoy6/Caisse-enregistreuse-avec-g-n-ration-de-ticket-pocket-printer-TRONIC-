<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caisse POS - TRONIC 5890</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #2563eb;
      --green: #16a34a;
      --danger: #dc2626;
      --text: #f3f4f6;
      --border: #2e2e38;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: var(--card); padding: 12px 20px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.2rem; color: #fff; }

    .pos-container { display: flex; flex: 1; overflow: hidden; }

    /* Catalogue Produits */
    .catalog-section { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .product-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 8px; text-align: center; cursor: pointer; user-select: none; }
    .product-card:active { transform: scale(0.96); background: var(--accent); }
    .product-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
    .product-price { font-size: 0.8rem; color: #9ca3af; }

    /* Panier */
    .cart-section { width: 360px; background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    .cart-header { padding: 12px; border-bottom: 1px solid var(--border); font-weight: bold; display: flex; justify-content: space-between; }
    .cart-items { flex: 1; overflow-y: auto; padding: 10px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    
    .cart-summary { padding: 15px; background: #16161a; border-top: 1px solid var(--border); }
    .summary-total { font-size: 1.3rem; font-weight: bold; display: flex; justify-content: space-between; margin-top: 5px; color: #fff; }

    .pay-actions { padding: 15px; background: #16161a; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); }
    .btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; color: #fff; text-align: center; }
    .btn-green { background: var(--green); }
    .btn-danger { background: var(--danger); padding: 4px 8px; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Zone Ticket Caché / Canvas */
    #ticketContainer { position: absolute; left: -9999px; width: 384px; background: #fff; color: #000; padding: 15px; font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Caisse Enregistreuse — TRONIC 5890</h1>
  </header>

  <div class="pos-container">
    <!-- Catalogue -->
    <div class="catalog-section">
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Panier -->
    <div class="cart-section">
      <div class="cart-header">
        <span>Ticket en cours</span>
        <button class="btn btn-danger" onclick="clearCart()">Vider</button>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <div class="cart-summary">
        <div class="summary-total">
          <span>TOTAL :</span>
          <span id="summaryTotal">0.00 €</span>
        </div>
      </div>

      <div class="pay-actions">
        <button id="btnGenerate" class="btn btn-green" onclick="generateTicketImage()" disabled>
          📸 Générer le Ticket (Image pour LuckPrinter)
        </button>
      </div>
    </div>
  </div>

  <!-- Structure du ticket généré en HTML -->
  <div id="ticketContainer">
    <div style="text-align:center; font-weight:bold; font-size:16px;">MON COMMERCE</div>
    <div style="text-align:center; font-size:11px;">Ticket de Caisse</div>
    <div style="border-bottom:1px dashed #000; margin:8px 0;"></div>
    <div id="tDate" style="font-size:10px;"></div>
    <div style="border-bottom:1px dashed #000; margin:8px 0;"></div>
    <div id="tItems"></div>
    <div style="border-bottom:1px dashed #000; margin:8px 0;"></div>
    <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:bold;">
      <span>TOTAL :</span>
      <span id="tTotal">0.00 €</span>
    </div>
    <div style="border-bottom:1px dashed #000; margin:8px 0;"></div>
    <div style="text-align:center; font-size:11px; margin-top:10px;">Merci de votre visite !</div>
  </div>

  <canvas id="renderCanvas" style="display:none;"></canvas>

  <script>
    const products = [
      { id: 1, name: "Baguette", price: 1.10 },
      { id: 2, name: "Croissant", price: 1.20 },
      { id: 3, name: "Café Espresso", price: 1.80 },
      { id: 4, name: "Eau 50cl", price: 1.50 },
      { id: 5, name: "Sandwich", price: 4.50 },
      { id: 6, name: "Soda", price: 2.50 }
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';
      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card" onclick="addToCart(${p.id})">
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price.toFixed(2)} €</div>
          </div>
        `;
      });
    }

    function addToCart(id) {
      const p = products.find(i => i.id === id);
      const item = cart.find(i => i.id === id);
      if (item) item.qty++;
      else cart.push({ ...p, qty: 1 });
      updateCart();
    }

    function clearCart() {
      cart = [];
      updateCart();
    }

    function updateCart() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const lineTotal = item.qty * item.price;
        total += lineTotal;
        container.innerHTML += `
          <div class="cart-item">
            <div><b>${item.name}</b> (${item.qty}x)</div>
            <div>${lineTotal.toFixed(2)} €</div>
          </div>
        `;
      });

      document.getElementById('summaryTotal').innerText = `${total.toFixed(2)} €`;
      document.getElementById('btnGenerate').disabled = cart.length === 0;
    }

    function generateTicketImage() {
      const now = new Date();
      document.getElementById('tDate').innerText = `Date : ${now.toLocaleDateString('fr-FR')} ${now.toLocaleTimeString('fr-FR')}`;
      
      const tItems = document.getElementById('tItems');
      tItems.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const lineTotal = item.qty * item.price;
        total += lineTotal;
        tItems.innerHTML += `
          <div style="display:flex; justify-content:space-between; font-size:12px;">
            <span>${item.name} x${item.qty}</span>
            <span>${lineTotal.toFixed(2)} €</span>
          </div>
        `;
      });

      document.getElementById('tTotal').innerText = `${total.toFixed(2)} €`;

      // Conversion du HTML en Image PNG (Largeur 384px exacte pour TRONIC 5890)
      const ticketEl = document.getElementById('ticketContainer');
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');

      const width = 384;
      const height = ticketEl.offsetHeight;
      canvas.width = width;
      canvas.height = height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      // Rendu du texte sur le Canvas
      ctx.fillStyle = '#000000';
      ctx.font = '14px monospace';
      
      const lines = ticketEl.innerText.split('\n');
      let y = 20;
      lines.forEach(l => {
        if (l.trim() !== '') {
          ctx.fillText(l, 10, y);
          y += 18;
        }
      });

      // Téléchargement automatique du PNG
      const link = document.createElement('a');
      link.download = `ticket-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();

      clearCart();
    }

    renderProducts();
  </script>
</body>
</html>
